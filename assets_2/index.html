<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador de Idade</title>
    <script src="https://kit.fontawesome.com/d1f07ec24b.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="../assets_2/css/style.css">
</head>
<body>
    <header>
        <h1>Verificador de Idade</h1>
    </header>
    <section id="container">
        <div id="input-data">
            <div>
                <label for="nasc">Ano de Nascimento:</label>
                <input type="number" name="nascimento" id="nasc">
            </div>
            <div>
                <label for="sexo">Sexo:</label>
                <input type="radio" name="sexo" id="masculino"> Masculino
                <input type="radio" name="sexo" id="feminino"> Feminino
            </div>
            <button id="btn">Verificar</button>
        </div>
        <div class="imagens">
            <h1 id="resultado">Resultado</h1>
            <picture >
                <img id="fotos" src="../assets_2/img/crianca-masc.png" alt="foto-crianca-masc">
            </picture>
        </div>

    </section>
    <footer>
        <a href="https://www.cursoemvideo.com/" target="_blank"><i class="fa-regular fa-copyright"></i>Curso em Vídeo</a>
    </footer>
    <script src="../assets_2/js/main.js"></script>
</body>
</html>
